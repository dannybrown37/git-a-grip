[project]
name = "git-a-grip"
version = "0.7.0"
description = "Pre-commit hooks that fail fast on bad commit messages, re-stage what they fix, keep your docs true, and run your tests -- plus a cross-repo hook audit."
requires-python = ">=3.11"
authors = [{ name = "Danny Brown", email = "dannybrown37@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pre-commit", "git", "hooks", "commitizen", "ruff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

# What the *commands* need, and nothing else -- this is what a person gets
# from `uv tool install git-a-grip`. pyyaml for `gag audit`; commitizen for the
# commitizen-early hook, which resolves it out of this install like every other
# non-ruff hook.
#
# Hook-only tools are deliberately absent: pre-commit builds each hook its own
# env, so `.pre-commit-hooks.yaml` declares them per hook via
# `additional_dependencies` and only the hooks that need one pay for it. A
# consuming repo still passes nothing.
dependencies = ["commitizen>=4.0", "pyyaml>=6.0"]

[project.optional-dependencies]
# For running the hook entry points outside pre-commit (`uv tool install
# 'git-a-grip[hooks]'`). Keep the ruff pin identical to the one in
# `.pre-commit-hooks.yaml` -- tests/test_packaging.py asserts they match.
hooks = ["ruff>=0.6"]

[project.scripts]
# Typed by a person. One namespace, so `gag --help` is the whole surface of
# the tool; every subcommand lives in `git_a_grip.cli:COMMANDS`.
gag = "git_a_grip.cli:main_cli"
git-a-grip = "git_a_grip.cli:main_cli"

# The hook entry points are deliberately NOT here. pre-commit runs a hook's
# `entry:` with its env's bin/ first on PATH, so `python -m git_a_grip.hooks
# <id>` reaches them without a console script -- and `gag` stays the only
# thing this package puts on a person's PATH.

[project.urls]
Homepage = "https://github.com/dannybrown37/git-a-grip"
Source = "https://github.com/dannybrown37/git-a-grip"
Issues = "https://github.com/dannybrown37/git-a-grip/issues"
Changelog = "https://github.com/dannybrown37/git-a-grip/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_a_grip"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
version_provider = "pep621"
# The rev a reader copies out of the README has to be the rev that exists.
# This is commitizen's job rather than a pre-commit hook's: `cz bump` runs in
# CI, in a commit no hook ever sees, and *that* commit is the one the tag
# lands on. A hook would leave every released README a version behind --
# stale in exactly the copy people paste. `version_files` rewrites it inside
# the bump commit instead. tests/test_packaging.py asserts it stayed true.
version_files = ["README.md:rev: v"]

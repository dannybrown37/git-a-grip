[project]
name = "git-a-grip"
version = "0.1.0"
description = "Personal pre-commit hooks: fail fast on bad commit messages, bump versions on push."
requires-python = ">=3.11"
authors = [{ name = "Danny Brown", email = "dannybrown37@gmail.com" }]
readme = "README.md"

# A real dependency rather than something consumers pass via
# `additional_dependencies`. pre-commit builds this repo an isolated env, so
# every hook here reaches commitizen the same way no matter how the consuming
# repo happens to install it -- which is the whole reason this repo exists.
dependencies = ["commitizen>=4.0", "ruff>=0.6"]

[project.scripts]
commitizen-early = "git_a_grip.commitizen_early:main_cli"
bump-on-push = "git_a_grip.bump_on_push:main_cli"
ruff-check-hook = "git_a_grip.ruff_hooks:check_cli"
ruff-format-hook = "git_a_grip.ruff_hooks:format_cli"
pytest-hook = "git_a_grip.pytest_hook:main_cli"

[project.urls]
Homepage = "https://github.com/dannybrown37/git-a-grip"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_a_grip"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
version_provider = "pep621"

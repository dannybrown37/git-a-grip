default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Dogfood: this repo's own hooks, run from the working tree rather than a
  # pinned rev, so a change that breaks them fails here before it ships.
  - repo: local
    hooks:
      - id: commitizen-early
        name: Commitizen check (early)
        entry: uv run commitizen-early
        language: system
        always_run: true
        pass_filenames: false
        fail_fast: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff-check-hook --config .ruff.toml
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff-format-hook --config .ruff.toml
        language: system
        types: [python]
        require_serial: true

      - id: tests
        name: Tests
        entry: uv run pytest-hook tests/ -q
        language: system
        files: ^(src/|tests/).*
        pass_filenames: false

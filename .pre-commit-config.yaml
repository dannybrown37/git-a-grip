default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Dogfood: this repo's own hooks, run from the working tree rather than a
  # pinned rev, so a change that breaks them fails here before it ships.
  - repo: local
    hooks:
      - id: commitizen-early
        name: Commitizen check (early)
        entry: uv run python -m git_a_grip.hooks commitizen-early
        language: system
        always_run: true
        pass_filenames: false
        fail_fast: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run python -m git_a_grip.hooks ruff-check --config .ruff.toml
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run python -m git_a_grip.hooks ruff-format --config .ruff.toml
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: Mypy
        entry: uv run python -m git_a_grip.hooks mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: embed-tree
        name: README file tree
        entry: uv run python -m git_a_grip.hooks embed-tree
        language: system
        always_run: true
        pass_filenames: false

      - id: embed-command
        name: README hook reference
        # The command is one argument: entry: is shlex-split, so an unquoted
        # `--command=uv run gag hooks` would arrive as four.
        entry: >-
          uv run python -m git_a_grip.hooks embed-command
          --marker=hooks "--command=uv run gag hooks"
        language: system
        # What the block is made of: the docs themselves, and the version
        # the header prints.
        files: ^(src/git_a_grip/(hook_docs|version)\.py|README\.md)$
        pass_filenames: false

      - id: block-private-terms
        name: Privacy terms
        entry: uv run python -m git_a_grip.hooks block-private-terms
        language: system
        always_run: true
        pass_filenames: false

      - id: zizmor
        name: Zizmor
        # --with, because zizmor is a binary a consumer gets from
        # additional_dependencies -- there is nothing to import, and this
        # repo does not depend on it.
        entry: uv run --with zizmor python -m git_a_grip.hooks zizmor
        language: system
        files: ^(\.github/workflows/.*\.ya?ml|(.*/)?action\.ya?ml)$
        require_serial: true

      - id: tests
        name: Tests
        entry: uv run python -m git_a_grip.hooks pytest tests/ -q
        language: system
        files: ^(src/|tests/).*
        pass_filenames: false

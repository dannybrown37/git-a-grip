- id: commitizen-early
  name: Commitizen check (early)
  description: >-
    Reject a non-conventional commit message during the pre-commit stage,
    before the slow hooks run, by recovering it from git's argv.
  entry: python -m git_a_grip.hooks commitizen-early
  language: python
  stages: [pre-commit]
  always_run: true
  pass_filenames: false

- id: ruff-check
  name: Ruff check
  description: >-
    Lint with `ruff check --fix`, re-staging the files it fixed so the fix is
    part of the commit rather than left dirty in the working tree.
  entry: python -m git_a_grip.hooks ruff-check
  language: python
  types: [python]
  # ruff is not a dependency of the package -- only these two hooks need it,
  # and pulling it into `pip install git-a-grip` would tax the commands with
  # a compiler-sized wheel they never call. Override the version per repo by
  # setting your own `additional_dependencies: [ruff==x.y.z]`.
  additional_dependencies: [ruff>=0.6]
  # Both ruff hooks call `git add`; running them in parallel races index.lock.
  require_serial: true

- id: ruff-format
  name: Ruff format
  description: >-
    Format with `ruff format`, re-staging the files it rewrote.
  entry: python -m git_a_grip.hooks ruff-format
  language: python
  types: [python]
  additional_dependencies: [ruff>=0.6]
  require_serial: true

- id: mypy
  name: Mypy
  description: >-
    Type-check the project with mypy, through a runner that resolves the
    project's own environment (`uv run mypy` by default). Passes no targets
    of its own, so the hook checks what `mypy` checks by hand.
  entry: python -m git_a_grip.hooks mypy
  language: python
  # Same reasoning as tsc: the tool is told what to check by the project's
  # own config, never by the list of files that happened to change.
  types: [python]
  pass_filenames: false

- id: embed-tree
  name: README file tree
  description: >-
    Regenerate the file tree between the `<!-- tree:start -->` markers in the
    README from `git ls-files`, and re-stage it.
  entry: python -m git_a_grip.hooks embed-tree
  language: python
  always_run: true
  pass_filenames: false

- id: embed-command
  name: Embedded command output
  description: >-
    Run the command named in `args` and keep its output -- `--help`, `make
    help` -- between that block's markers in the README, re-staging it.
  entry: python -m git_a_grip.hooks embed-command
  language: python
  # always_run because the default has no way to know what changes the output.
  # Scope it in your own config: a subprocess on every commit, for a block that
  # moves twice a year, is the kind of tax that gets a hook removed.
  always_run: true
  pass_filenames: false

- id: regen-file
  name: Regenerated file
  description: >-
    Run the generator named in `args` and re-stage the files it rewrote, for
    a script that owns a whole file rather than a marked block.
  entry: python -m git_a_grip.hooks regen-file
  language: python
  # always_run for the same reason as embed-command: nothing here knows what
  # feeds the generator. Scope it with your own `files:` -- a subprocess on
  # every commit is the tax that gets a hook removed.
  always_run: true
  pass_filenames: false
  # Calls `git add`; running two copies in parallel races index.lock.
  require_serial: true

- id: eslint
  name: ESLint
  description: >-
    Lint with the project's own eslint (`--fix`, and `--max-warnings=0`
    unless you say otherwise), re-staging the files it fixed.
  entry: python -m git_a_grip.hooks eslint
  language: python
  types_or: [javascript, jsx, ts, tsx]
  require_serial: true

- id: tsc
  name: TypeScript
  description: >-
    Type-check the project with the project's own tsc. Never passes
    filenames -- tsc ignores tsconfig.json when it is given any.
  entry: python -m git_a_grip.hooks tsc
  language: python
  types_or: [ts, tsx]
  pass_filenames: false

- id: vitest
  name: Vitest
  description: >-
    Run the project's vitest suite once with `vitest run` -- never the watch
    mode a bare `vitest` starts, which would hang the commit.
  entry: python -m git_a_grip.hooks vitest
  language: python
  types_or: [javascript, jsx, ts, tsx]
  # Runs the suite, not the changed files: a test that broke lives somewhere
  # other than the file that broke it.
  pass_filenames: false

- id: pytest
  name: Tests
  description: >-
    Run the consuming repo's test suite from the repo root, through a runner
    that resolves the project's own environment (`uv run pytest` by default,
    override with `--runner=...`).
  entry: python -m git_a_grip.hooks pytest
  language: python
  files: ^(src/|tests/).*
  pass_filenames: false

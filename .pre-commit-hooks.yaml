- id: commitizen-early
  name: Commitizen check (early)
  description: >-
    Reject a non-conventional commit message during the pre-commit stage,
    before the slow hooks run, by recovering it from git's argv.
  entry: python -m git_a_grip.hooks commitizen-early
  language: python
  stages: [pre-commit]
  always_run: true
  pass_filenames: false

- id: ruff-check
  name: Ruff check
  description: >-
    Lint with `ruff check --fix`, re-staging the files it fixed so the fix is
    part of the commit rather than left dirty in the working tree.
  entry: python -m git_a_grip.hooks ruff-check
  language: python
  types: [python]
  # ruff is not a dependency of the package -- only these two hooks need it,
  # and pulling it into `pip install git-a-grip` would tax the commands with
  # a compiler-sized wheel they never call. Override the version per repo by
  # setting your own `additional_dependencies: [ruff==x.y.z]`.
  additional_dependencies: [ruff>=0.6]
  # Both ruff hooks call `git add`; running them in parallel races index.lock.
  require_serial: true

- id: ruff-format
  name: Ruff format
  description: >-
    Format with `ruff format`, re-staging the files it rewrote.
  entry: python -m git_a_grip.hooks ruff-format
  language: python
  types: [python]
  additional_dependencies: [ruff>=0.6]
  require_serial: true

- id: readme-tree
  name: README file tree
  description: >-
    Regenerate the file tree between the `<!-- tree:start -->` markers in the
    README from `git ls-files`, and re-stage it.
  entry: python -m git_a_grip.hooks readme-tree
  language: python
  always_run: true
  pass_filenames: false

- id: eslint
  name: ESLint
  description: >-
    Lint with the project's own eslint (`--fix`, and `--max-warnings=0`
    unless you say otherwise), re-staging the files it fixed.
  entry: python -m git_a_grip.hooks eslint
  language: python
  types_or: [javascript, jsx, ts, tsx]
  require_serial: true

- id: tsc
  name: TypeScript
  description: >-
    Type-check the project with the project's own tsc. Never passes
    filenames -- tsc ignores tsconfig.json when it is given any.
  entry: python -m git_a_grip.hooks tsc
  language: python
  types_or: [ts, tsx]
  pass_filenames: false

- id: pytest
  name: Tests
  description: >-
    Run the consuming repo's test suite from the repo root, through a runner
    that resolves the project's own environment (`uv run pytest` by default,
    override with `--runner=...`).
  entry: python -m git_a_grip.hooks pytest
  language: python
  files: ^(src/|tests/).*
  pass_filenames: false

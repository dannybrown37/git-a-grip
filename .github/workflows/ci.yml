# Check every push and PR; on a green main, cut the release tag.
#
# The release is CI's consequence, not its cause: nothing is bumped or tagged
# until lint, tests, and the install proofs have passed on the merged commit.
# Pushing the tag is what triggers publish.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor in requires-python and whatever is current: the two
        # versions where a syntax or stdlib assumption actually breaks.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync

      - name: Lint
        run: uv run ruff check --config .ruff.toml src tests

      - name: Format
        run: uv run ruff format --check --config .ruff.toml src tests

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      # The commands must work from a bare wheel with no dev group and no
      # `hooks` extra -- that is what `uv tool install git-a-grip` gets, and
      # it is exactly what the dependency split could break.
      - name: Commands run from the built wheel alone
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            gag --help
          uv run --isolated --no-project --with dist/*.whl \
            gag audit --help
          uv run --isolated --no-project --with dist/*.whl \
            gag sync --help
          uv run --isolated --no-project --with dist/*.whl \
            gag hooks --help

      # The hooks are the other half of the split. try-repo builds them from
      # .pre-commit-hooks.yaml in the isolated env a consumer would get, so
      # this fails if ruff stops arriving via additional_dependencies -- which
      # the repo's own config, using `language: system` locally, cannot catch.
      # SKIP=embed-command,regen-file because try-repo runs every hook with no
      # args, and either one without its `--command` refuses to do anything --
      # correctly, since they run only what a consumer names. Their behaviour
      # under the args they are meant to have is covered by
      # tests/test_embed_command.py and tests/test_regen_file.py, and by this
      # repo's own config in the step below.
      - name: Hooks install and run as a consumer would get them
        env:
          SKIP: embed-command,regen-file
        run: uv run --with pre-commit pre-commit try-repo . --all-files

      - name: This repo's own config still passes
        run: uv run --with pre-commit pre-commit run --all-files

  bump:
    needs: [check]
    # Only a green push to main releases, and never the bump's own commit --
    # that would recurse.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so commitizen can read the tags it bumps from, and a
          # PAT because pushes made with the default GITHUB_TOKEN do not
          # trigger workflows -- the tag would land and publish.yml would
          # never fire.
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - uses: astral-sh/setup-uv@v7

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: cz
        run: |
          PRE_SHA="$(git rev-parse HEAD)"
          # --no-raise 21: "no commits eligible for a bump" is the normal
          # outcome of a docs- or chore-only push, not a failure.
          uv run cz --no-raise 21 bump --yes
          POST_SHA="$(git rev-parse HEAD)"
          if [[ "$PRE_SHA" == "$POST_SHA" ]]; then
            echo "bumped=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bumped=true" >>"$GITHUB_OUTPUT"

          # cz bump rewrites the version in pyproject.toml only, so uv.lock's
          # embedded git-a-grip version drifts. Re-lock and fold that into the
          # bump commit, keeping the tag on the commit it names.
          uv lock
          if ! git diff --quiet -- uv.lock; then
            TAG="$(git describe --tags --exact-match HEAD)"
            git tag -d "$TAG"
            git add uv.lock
            git commit --amend --no-edit
            git tag -a "$TAG" -m "$TAG"
          fi

      - name: Push bump commit and tag
        if: steps.cz.outputs.bumped == 'true'
        run: git push origin "HEAD:${{ github.ref_name }}" --tags

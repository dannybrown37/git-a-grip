# Publish to PyPI when ci.yml's bump job pushes a version tag.
#
# By the time a tag exists, CI has already passed on that commit -- the bump
# job is gated on it -- so this workflow only builds and uploads.
#
# Authentication is PyPI trusted publishing (OIDC), so there is no API token
# in this repo's secrets. It requires a one-time pending-publisher entry on
# pypi.org naming this repo, this workflow file, and the `pypi` environment.
name: publish

on:
  push:
    tags: ['v*']

# The upload is authorised by the OIDC token the publish job asks for, not
# by anything the repo token can do.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          # A tag build produces the artifact that gets published, so it
          # starts from a clean cache rather than one a branch build filled.
          enable-cache: false

      # The tag is the version. Publishing anything else would put a release
      # on PyPI that no tag in this repo describes, and PyPI never lets that
      # version number be reused.
      - name: Tag matches the packaged version
        run: |
          packaged="v$(uv version --short)"
          if [ "$packaged" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != packaged ${packaged}" >&2
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The OIDC token trusted publishing exchanges for an upload token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
